# build แอป Android ดูจำนวนคลิก (android/) แล้วอัปโหลดไฟล์ .apk ไว้ที่ GitHub Release ชื่อ "clicks-app"
# เปิดหน้า Releases ของ repo บนมือถือแล้วโหลด adhub-clicks.apk ไปติดตั้งได้เลย (รุ่นใหม่ติดตั้งทับรุ่นเก่า)
name: Android clicks app

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-clicks-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk adhub-clicks.apk
      - uses: actions/upload-artifact@v4
        with:
          name: adhub-clicks
          path: adhub-clicks.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clicks-app --cleanup-tag --yes || true
          gh release create clicks-app adhub-clicks.apk \
            --target "$GITHUB_SHA" \
            --title "แอปดูจำนวนคลิก (รุ่น ${GITHUB_RUN_NUMBER})" \
            --notes "build จาก ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} โหลด adhub-clicks.apk ไปติดตั้งบนมือถือ Android"
      # เก็บไฟล์ไว้ใน branch "clicks-app-apk" ด้วย (ทับของเดิม) ให้ดึงด้วย git ได้ เผื่อโหลดจากหน้า Releases บนมือถือไม่ได้
      - name: Save APK to a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d) && cp adhub-clicks.apk "$d/" && cd "$d"
          git init -q -b clicks-app-apk && git add adhub-clicks.apk
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "adhub-clicks.apk รุ่น ${GITHUB_RUN_NUMBER} จาก ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" clicks-app-apk
