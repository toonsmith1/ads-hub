# หน้าจัดการเป็นไฟล์ static ล้วน ไม่มีขั้น build
[build]
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ads.js และ config.js ถูกเว็บอื่นโหลดไปใช้ ให้แคชสั้นๆ แก้แล้วเห็นผลภายใน 5 นาที
[[headers]]
  for = "/ads.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
